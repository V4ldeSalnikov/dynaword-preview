name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_public_api:
        description: Verify the live API (disable only for a static migration while the API is intentionally paused)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_ENABLE_RECORD_EXPLORER: ${{ vars.VITE_ENABLE_RECORD_EXPLORER || 'false' }}
      VITE_ENABLE_REMOTE_EXPLORERS: ${{ vars.VITE_ENABLE_REMOTE_EXPLORERS || 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install dependencies
        run: |
          npm --prefix web ci
          python -m pip install -r server/requirements-dev.txt
      - name: Test API behavior on isolated fixtures
        run: python -m unittest discover -s server -v
      - name: Verify chat calculations and missing-data handling
        run: npm --prefix web run test:chat
      - name: Build the API container
        run: docker build --tag dynaword-api:ci .
      - name: Check API startup with a read-only data mount
        run: |
          mkdir -p "$RUNNER_TEMP/dynaword-data/texts"
          cleanup() {
            docker logs dynaword-api-smoke
            docker rm -f dynaword-api-smoke
          }
          trap cleanup EXIT
          docker run -d --name dynaword-api-smoke -p 127.0.0.1:18000:8000 -v "$RUNNER_TEMP/dynaword-data:/app/.cache:ro" dynaword-api:ci
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 45 --max-time 10 http://127.0.0.1:18000/api/health
      - name: Require API configuration when the record explorer is enabled
        if: env.VITE_ENABLE_RECORD_EXPLORER == 'true' && env.VITE_API_BASE_URL == ''
        run: |
          echo 'Set VITE_API_BASE_URL before enabling the record explorer.' >&2
          exit 1
      - name: Build the static frontend
        run: npm --prefix web run build
      - name: Verify the enabled full-corpus APIs
        if: github.event_name != 'pull_request' && env.VITE_ENABLE_RECORD_EXPLORER == 'true' && env.VITE_API_BASE_URL != '' && (github.event_name != 'workflow_dispatch' || inputs.verify_public_api)
        env:
          PAGES_ORIGIN: ${{ vars.PAGES_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
          PUBLIC_API_WAIT_SECONDS: 1200
        run: python scripts/check_public_api.py
      - name: Explain static-only publication
        if: env.VITE_ENABLE_RECORD_EXPLORER != 'true' || (github.event_name == 'workflow_dispatch' && !inputs.verify_public_api)
        run: |
          echo '### Static website publication' >> "$GITHUB_STEP_SUMMARY"
          echo 'The record explorer is disabled or the operator explicitly skipped the live API check. Fixture tests and the production build still run. The overview and comparisons do not require a live API.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages build
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
